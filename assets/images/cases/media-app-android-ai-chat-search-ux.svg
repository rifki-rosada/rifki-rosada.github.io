<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Media Android App - AI Chat + Search UX</title>
  <desc id="desc">Interaction map for AI chat entry, suggestion taps, and synchronized search states.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172f"/>
      <stop offset="50%" stop-color="#111a36"/>
      <stop offset="100%" stop-color="#0a1024"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#44d2ff"/>
      <stop offset="100%" stop-color="#7d7bff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="72" y="70" width="1056" height="535" rx="22" fill="none" stroke="rgba(127,163,255,0.32)" stroke-width="2"/>

  <rect x="120" y="148" width="380" height="160" rx="16" fill="rgba(31,52,94,0.72)" stroke="rgba(116,162,255,0.55)"/>
  <rect x="540" y="148" width="230" height="160" rx="16" fill="rgba(27,69,95,0.72)" stroke="rgba(116,162,255,0.55)"/>
  <rect x="820" y="148" width="260" height="160" rx="16" fill="rgba(34,67,120,0.72)" stroke="rgba(116,162,255,0.55)"/>

  <path d="M500 228h40" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M770 228h50" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>

  <text x="120" y="380" fill="#7dd7ff" font-size="24" font-family="'Segoe UI', Tahoma, sans-serif">Client Delivery</text>
  <text x="120" y="430" fill="#f0f5ff" font-size="42" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="700">Media Android App - AI Chat + Search UX</text>
  <text x="120" y="480" fill="#b8c7e8" font-size="24" font-family="'Segoe UI', Tahoma, sans-serif">Shipped a clearer AI-assisted discovery flow with fewer state mismatch edge cases.</text>
  <text x="120" y="534" fill="#8fb7ff" font-size="22" font-family="'Segoe UI', Tahoma, sans-serif">Android | Kotlin | WebView | Search UX</text>
